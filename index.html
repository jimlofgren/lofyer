<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lofyer</title>
<meta name="description" content="A lofi tape loop you play into: synth voice, delay and reverb, a tape that never stops, and a memory that pulls old moments back up.">
<meta name="theme-color" content="#e151af">
<meta property="og:title" content="lofyer">
<meta property="og:description" content="A lofi tape loop you play into.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="capGrad" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="0.6" stop-color="#f1e9d2"/>
      <stop offset="1" stop-color="#cfc4a6"/>
    </radialGradient>
    <radialGradient id="glossGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
</svg>
<header>
  <h1>lof<span>yer</span></h1>
  <p class="tagline"><span class="chain">voice → space → tape → memory</span> <span class="keys">· play with a w s e d f t g y h u j k · z / x shift octave · or switch on line in</span></p>
  <div id="headerKnobs"></div>
  <button id="randomize" class="foot start random" title="randomize all knobs and switches">⚄ <span>random</span></button>
  <button id="start" class="foot start">start</button>
  <div id="mainJack"></div>
</header>
<canvas id="scope"></canvas>
<main id="board"></main>
<svg id="cables"></svg>
<div class="paper-grain"></div>
<script src="processors.js"></script>
<script src="app.js"></script>
</body>
</html>
